const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
// Items: [day, period, len, title, subtitle, flag, note]. Flags show this week's absences: 'sub' (class has a substitute), 'away', 'cover'.
function buildPayload(by, id, pick){
  const st = S.settings, ent = byId(by === 'class' ? S.classes : S.teachers, id) || {}, R = S.result;
  let items = (R && R.placed || []).filter(x => inView(x, by, id) && trackKeeps(x, by, id, pick)).map(x => {
    const L = cellLabel(x, by), a = S.absences.find(b => b.teacherId === x.teacherId && b.date === weekDate(x.day));
    let flag = '', note = '';
    if(a){
      const sub = byId(S.teachers, a.picks[x.period]), self = a.picks[x.period] === 'self', t = byId(S.teachers, x.teacherId) || {}, r = byId(S.rooms, x.roomId) || {};
      if(by === 'class'){ flag = 'sub'; note = a.note || ''; L.sub = (x.batch ? `Batch ${x.batch}: ` : '') + (self ? `Self-study · ${r.name} · class monitor in charge` : sub ? `${sub.name} (substitute) · ${r.name}` : `${t.name} is away · cover being arranged`); }
      else { flag = 'away'; L.sub = self ? `You're away · students do self-study` : sub ? `You're away · ${sub.name} covers` : `You're away · cover not assigned yet`; }
    }
    return [x.day, x.period, x.len, L.title, L.sub, flag, note];
  });
  if(by === 'teacher') S.absences.forEach(a => absenceClasses(a).forEach(x => {
    if(a.picks[x.period] !== id || weekDate(x.day) !== a.date) return;
    const s = byId(S.subjects, x.subjectId) || {}, c = byId(S.classes, x.classId) || {}, r = byId(S.rooms, x.roomId) || {}, t = byId(S.teachers, a.teacherId) || {};
    items.push([x.day, x.period, x.len, s.name, `Cover for ${t.name} · ${c.name}${x.batch ? ' batch ' + x.batch : ''} · ${r.name}`, 'cover', a.note || '']);
  }));
  if(by === 'class'){
    ((byId(S.classes, id) || {}).fixed || []).forEach(f => { const [d, p] = f.sl.split('-').map(Number);
      if(f.label === 'Break') items.push([d, p, 1, 'Break', '', 'brk', '']);
      else if(f.label !== 'Not available') items.push([d, p, 1, f.label, f.sub || 'Shared lesson', '', '']); });
    const m = {};
    items.forEach(it => { const k = it[0]+'|'+it[1];
      if(!m[k]) m[k] = [...it];
      else { if(!m[k][3].split(' / ').includes(it[3])) m[k][3] += ' / ' + it[3]; m[k][4] += ' · ' + it[4]; m[k][5] = m[k][5] || it[5]; m[k][6] = m[k][6] || it[6]; } });
    items = Object.values(m);
  }
  const br = by === 'class' && R && R.breaks && R.breaks[id] != null ? R.breaks[id] : -1;
  return {c:st.college, t:ent.name || '', d:st.days, tm:periodTimes(), b:st.breakMode === 'same' ? st.breakAfter : 0, br, i:items};
}
function shareLink(pl){ return location.href.split('#')[0] + '#v=' + enc(pl); }
function phoneDays(pl){
  const ti = pl.d.indexOf(ALL_DAYS[(new Date().getDay() + 6) % 7]);
  if(phone.day == null || phone.day >= pl.d.length) phone.day = ti >= 0 ? ti : 0;
  const di = phone.day, items = pl.i.filter(x => x[0] === di).sort((a,b) => a[1] - b[1]);
  const FLAG = {sub:'Substitute today', away:'You are away', cover:'You are covering'};
  let rows = '';
  if(!items.length) rows = `<div class="pempty">No classes on ${pl.d[di]}</div>`;
  else {
    const end = Math.max(...items.map(x => x[1] + x[2]));
    const covered = q => items.some(x => x[1] < q && x[1] + x[2] > q);
    for(let p=0; p<end;){
      const it = items.find(x => x[1] === p);
      if(it && it[5] === 'brk'){ rows += `<div class="plunch">Break · ${pl.tm[p]}</div>`; p++; }
      else if(it){
        rows += `<div class="pcard ${it[5] ? 'f-' + it[5] : ''}" style="background:${colorFor(it[3])}"><div class="ptime">${pl.tm[p].split('–')[0]}<br><small>${pl.tm[p+it[2]-1].split('–')[1]}</small></div>
          <div>${it[5] ? `<span class="pflag">${FLAG[it[5]]}</span>` : ''}<b>${esc(it[3])}</b><small>${esc(it[4])}</small>${it[6] ? `<small class="pnote">Note: ${esc(it[6])}</small>` : ''}</div></div>`;
        p++;
      }
      else if(covered(p)) p++;
      else if(p === pl.br){ rows += `<div class="plunch">Break · ${pl.tm[p]}</div>`; p++; }
      else { rows += `<div class="pfree"><span>${pl.tm[p].split('–')[0]}</span>Free period</div>`; p++; }
      if(pl.b > 0 && p === pl.b && p < end) rows += `<div class="plunch">Break</div>`;
    }
    rows += `<div class="pempty" style="padding:12px">Done for the day at ${pl.tm[end-1].split('–')[1]}</div>`;
  }
  return `<div class="pdays">${pl.d.map((d,i) => `<button class="chip ${i===di?'on':''}" onclick="phone.day=${i};render()">${d}${i===ti?'<i>TODAY</i>':''}</button>`).join('')}</div>${rows}`;
}

  const rows = [['Day', ...times.map((t,i) => `P${i+1} ${t}`)]];
  st.days.forEach((d, di) => rows.push([d, ...range(st.periods).map(p => {
    const here = cells.filter(c => c.day === di && c.period <= p && c.period + c.len > p);
    if(!here.length) return p === br ? 'Break' : ''; const L = mergeLabels(here, view.by); return `${L.title} - ${L.subs.join(' | ')}`; })]));
  const name = (byId(viewList(view.by), view.id) || {}).name || 'timetable';
  download(rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'), `${name}.csv`, 'text/csv');
}
function exportJSON(){ download(JSON.stringify(S, null, 2), `${S.settings.college || 'timetable'}.json`, 'application/json'); }
function download(text, name, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); }
function importJSON(e){
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  f.text().then(t => { try{ const d = JSON.parse(t); S = Object.assign(blank(), d); S.settings = Object.assign(blank().settings, d.settings); save(); toast('File opened'); go('setup'); }catch(err){ toast('That file could not be read.'); } });
}
function resetAll(){ if(confirm('Clear everything and start over?')){ S = blank(); save(); ROLE = null; saveRole(); render(); } }
