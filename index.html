<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeWeave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
  :root{--paper:#fafaf8;--card:#fff;--ink:#141414;--muted:#8a8984;--line:#ebe9e4;--coral:#e4572e;--sun:#f5f2ea;--mint:#e6f2eb;--sky:#eef1f6;--lilac:#f0eef6;--soft:#f4f3ef}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.brand{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em;margin:0}
  a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .hidden{display:none}

  /* Layout */
  .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .rail{background:var(--card);border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
  .brand{font-size:26px;margin:0 10px 22px}
  .who{padding:0 10px;font-size:13px;font-weight:500;margin-bottom:8px}
  .who small{display:block;color:var(--muted);font-weight:400}
  .rg{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 10px 6px}
  .ri{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .ri:hover{color:var(--ink)}
  .ri.on{background:var(--soft);color:var(--ink);font-weight:500}
  .ri .ic{width:16px;font-size:12px;text-align:center;flex:none}
  .ri.on .ic{color:var(--coral)}
  .ri .ok{margin-left:auto;color:var(--muted);font-size:12px}
  .railfoot{margin-top:auto;padding-top:12px}
  main{padding:48px 56px;max-width:1080px;width:100%;min-width:0}

  /* Page heading */
  .ph{margin-bottom:28px}
  .eyebrow{display:block;color:var(--coral);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .ph h2{font-size:44px;line-height:1.05}
  .ph p{margin:10px 0 0;color:var(--muted);max-width:600px}

  /* Cards and buttons */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
  .card.flat{background:transparent}
  .card h3{font-size:24px;margin-bottom:4px}
  .row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
  .btn:hover{border-color:var(--ink)}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn.hot,.btn.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.hot:hover,.btn.ink:hover{background:#333}
  .btn.sun{border-color:var(--ink)}
  .btn.big{padding:12px 26px;font-size:15px}
  .btn.sm{padding:5px 12px;font-size:13px}
  .x{border:0;background:none;font-size:20px;cursor:pointer;color:#c4c2bc;line-height:1}
  .x:hover{color:var(--coral)}

  /* Forms and tables */
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--ink)}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 6px;vertical-align:middle}
  th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line)}
  tbody tr+tr td{border-top:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:32px}
  .days{display:flex;gap:8px;flex-wrap:wrap}
  .days label{border:1px solid var(--line);border-radius:99px;padding:6px 16px;cursor:pointer;font-size:14px;user-select:none;color:var(--muted)}
  .days label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
  .days input{display:none}
  .foot{display:flex;justify-content:space-between;margin-top:24px;gap:8px}
  .addbar{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}

  /* Messages, tags, chips */
  .msg{padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;border-left:3px solid var(--muted);background:var(--soft)}
  .msg.warn{border-left-color:#d9a400}
  .msg.bad{border-left-color:var(--coral);background:#fdf1ec}
  .msg.ok{border-left-color:#2f8f5b}
  .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
  .tag.g{color:#2f8f5b;border-color:#cfe6d9}
  .tag.y{color:#9a7400;border-color:#efe2b5}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .chip:hover{border-color:var(--ink)}
  .chip small{color:var(--muted)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on small{color:#bbb}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .stat{background:var(--card);padding:18px 20px}
  .stat b{display:block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:40px;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted)}
  .s1 b{color:var(--coral)}

  /* Timetable grid */
  .toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
  .toolbar>div{min-width:170px}
  .toolbar .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
  .tt{overflow-x:auto}
  .tt table{min-width:720px;table-layout:fixed;border-collapse:separate;border-spacing:3px}
  .tt th{border:0;text-align:center;padding:4px;letter-spacing:.04em}
  .tt th small{font-weight:400;text-transform:none;letter-spacing:0}
  .tt td{border:0!important;padding:0;height:64px;text-align:center;font-size:12px;background:#f7f6f2;border-radius:8px}
  .tt td.day{background:none;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;width:52px}
  .tt td.off{background:repeating-linear-gradient(45deg,#efede7,#efede7 3px,#f7f6f2 3px,#f7f6f2 8px);color:var(--muted)}
  .cell{border-radius:8px;padding:6px 8px;height:100%;display:flex;flex-direction:column;justify-content:center;line-height:1.3;box-shadow:inset 3px 0 0 rgba(20,20,20,.18);text-align:left}
  .cell b{font-weight:600}
  .cell small{color:#5c5b57}
  .brk{background:none!important;color:var(--muted);font-size:10px;letter-spacing:.2em;writing-mode:vertical-rl;transform:rotate(180deg)}
  .bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:99px}

  /* Modal and toast */
  .modal{position:fixed;inset:0;background:rgba(20,20,20,.3);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal .card{max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
  .slotgrid td{cursor:pointer;height:36px;text-align:center;border:1px solid var(--line)!important;background:var(--card);border-radius:6px;color:#fff}
  .slotgrid td.x{background:var(--coral);border-color:var(--coral)!important}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1}

  /* Login */
  .login{max-width:980px;margin:0 auto;padding:80px 20px}
  .hero{text-align:center;margin-bottom:48px}
  .logo{display:none}
  .hero h1{font-size:clamp(48px,8vw,80px);line-height:1}
  .hero p{font-size:17px;color:var(--muted);margin:12px 0 0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:28px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
  .tile:hover{border-color:var(--ink)}
  .tile h3{font-size:28px}
  .tile p{margin:0;color:var(--muted);font-size:14px}
  .tile .btn{margin-top:auto}

  /* Phone view */
  .phonewrap{max-width:440px;margin:0 auto;padding:20px 16px}
  .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .ptop b{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:22px}
  .seg{display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px;border-radius:99px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .phead{margin:20px 0 14px}
  .phead small{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
  .phead h2{font-size:40px;line-height:1.1}
  .pdays{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .pdays .chip{flex:none;text-align:center;padding:8px 14px}
  .pdays .chip i{display:block;font-style:normal;font-size:9px;letter-spacing:.08em;color:var(--coral)}
  .pcard{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:inset 3px 0 0 rgba(20,20,20,.18)}
  .pcard b{display:block;font-size:15px;font-weight:600}
  .pcard small{color:#5c5b57}
  .ptime{font-weight:600;font-size:14px;line-height:1.3}
  .ptime small{font-weight:400}
  .pfree{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;color:var(--muted);font-size:13px}
  .pfree span{font-weight:600;margin-right:12px}
  .plunch{color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:8px;margin-bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .pempty{text-align:center;padding:30px 10px;color:var(--muted)}
  .frame{border:1px solid var(--line);border-radius:36px;padding:14px 6px;width:320px;max-width:100%;height:600px;overflow:auto;background:var(--paper);box-shadow:0 20px 50px rgba(0,0,0,.08)}
  .frame .phonewrap{padding:6px}
  .sharegrid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
  #qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:inline-block;min-height:60px}
  .best{color:#2f8f5b;font-weight:600}

  @media print{.rail,.toolbar,.noprint,.foot{display:none!important}.layout{display:block}body{background:#fff}.card{border:0;padding:0}main{padding:0}}
  @media (max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .rail{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:5}
    .brand{margin:0 10px 0 2px;font-size:22px;white-space:nowrap}
    .who,.rg{display:none}
    .railfoot{margin:0;padding:0}
    .ri{width:auto}
    main{padding:24px 16px}
    .ph h2{font-size:36px}
    .card{padding:18px}
    .sharegrid{grid-template-columns:1fr}
  }
  .badge{background:var(--coral);color:#fff!important;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
  .tt td.brkcell{background:none;border:1px dashed var(--line)!important;color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
  .pflag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:600;margin-bottom:2px}
  .pnote{display:block;margin-top:4px;font-style:italic}
  .pcard.f-away{opacity:.55}
  .pcard.f-cover,.pcard.f-sub{box-shadow:inset 3px 0 0 var(--coral)}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json" class="hidden" onchange="importJSON(event)">
<input type="file" id="sheetIn" accept=".csv,.xlsx,.xls" class="hidden" onchange="importSheet(event)">
<input type="file" id="fetIn" accept=".html,.htm" class="hidden" onchange="openFET(event)">

<script>
const PAGES = {
  setup:   {t:'College',     g:'Set up',    i:'1', roles:['admin']},
  rooms:   {t:'Rooms',       g:'Set up',    i:'2', roles:['admin']},
  teachers:{t:'Teachers',    g:'Set up',    i:'3', roles:['admin','dept']},
  classes: {t:'Classes',     g:'Set up',    i:'4', roles:['admin','dept']},
  subjects:{t:'Subjects',    g:'Set up',    i:'5', roles:['admin','dept']},
  tracks:  {t:'Tracks',      g:'Set up',    i:'6', roles:['admin']},
  result:  {t:'Timetable',   g:'Timetable', i:'▦', roles:['admin','dept']},
  subs:    {t:'Absences',    g:'Timetable', i:'⇄', roles:['admin','dept']},
  versions:{t:'Compare',     g:'Timetable', i:'⚖', roles:['admin']},
  share:   {t:'Share',       g:'Timetable', i:'↗', roles:['admin']}
};
const ALL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];
const PREFS = [['any','Any time'],['nofirst','No first period'],['nolast','No last period'],['morning','Mornings only'],['afternoon','Afternoons only']];
const REASONS = ['Sick','Personal','Official duty','Training','Other'];
// Professional-elective tracks (from 5th semester). Each track lists its syllabus courses for reference.
const TRACKS = [
  {id:'t1', name:'Software Engineering', short:'SE', courses:['Software Project Management', 'Software Testing and Quality Assurance (+ lab)', 'Software Metrics', 'Component Based Development (+ lab)', 'Applied Cloud Computing (+ lab)']},
  {id:'t2', name:'Network Technologies', short:'Networks', courses:['Advanced Computer Networks', 'Network Security and Cryptography (+ lab)', 'Blockchain Technology', 'Internet of Things (+ lab)', 'Applied Cloud Computing (+ lab)']},
  {id:'t3', name:'Data Management', short:'Data', courses:['Statistics for Data Science', 'Advanced Database Management Systems (+ lab)', 'Big Data', 'Data Science (+ lab)', 'Applied Cloud Computing (+ lab)']},
  {id:'t4', name:'Machine Intelligence', short:'MI', courses:['Information Retrieval', 'Natural Language Processing (+ lab)', 'Human Computer Interaction', 'Deep Learning (+ lab)', 'Applied Cloud Computing (+ lab)']},
  {id:'t5', name:'Algorithm Design and Programming', short:'Algo & Prog', courses:['System Programming', 'Java Programming (+ lab)', 'Parallel and Distributed Algorithms', 'Mobile Application Development (+ lab)', 'Applied Cloud Computing (+ lab)']}
];
// Which track each elective in the timetable belongs to, by its short code. SC and CV are Machine Intelligence as the
// department confirmed; the rest are suggestions for the admin to check on the Tracks page.
const TRACK_MAP = {SC:['t4'], CV:['t4'], GAI:['t4'], CNS:['t2'], SDN:['t2'], DWBI:['t3'], DWDM:['t3'], OOAD:['t1'], DAAA:['t5'], WT:['t5'], ACC:['t1','t2','t3']};
const PALETTE = ['#f6e6de','#f3eddb','#e2efe7','#e2e8f3','#ebe5f3','#f3e3e9','#e0eeed','#eee7da'];
const uid = () => Math.random().toString(36).slice(2, 9);
const range = n => Array.from({length:n}, (_,i) => i);
const byId = (list, id) => list.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const blank = () => ({
  settings:{college:'', days:['Mon','Tue','Wed','Thu','Fri'], periods:7, start:'08:30', length:60,
            breakMode:'staggered', breakSlots:[2,3], breakAfter:4, breakLength:30, maxStreak:3, adminPin:'1234'},
  departments:[], rooms:[], teachers:[], classes:[], subjects:[], result:null, versions:[], absences:[],
  tracks:{prefixes:'D3, D4', list:JSON.parse(JSON.stringify(TRACKS)), map:JSON.parse(JSON.stringify(TRACK_MAP))}
});
let S = blank(), ROLE = null, SHARED = null, page = 'setup';
let view = {by:'class', id:null};
let subs = {absenceId:null};
let phone = {by:'class', id:null, day:null};
let share = {by:'class', id:null};

// ---------- Storage ----------
function save(){ try{ localStorage.setItem('timeweave', JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const d = JSON.parse(localStorage.getItem('timeweave')); if(d){ S = Object.assign(blank(), d); S.settings = Object.assign(blank().settings, d.settings); } }catch(e){}
  try{ ROLE = JSON.parse(sessionStorage.getItem('tw-role')); }catch(e){}
}
function saveRole(){ try{ sessionStorage.setItem('tw-role', JSON.stringify(ROLE)); }catch(e){} }
function changed(){ S.result = null; save(); }
function toast(text){ const t = document.getElementById('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }

// ---------- Dates ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseIso = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const dayIdxOfDate = s => S.settings.days.indexOf(ALL_DAYS[(parseIso(s).getDay() + 6) % 7]);
const niceDate = s => parseIso(s).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const todayIdx = () => S.settings.days.indexOf(ALL_DAYS[(new Date().getDay() + 6) % 7]);
function weekDate(di){
  const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7);
  return iso(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + ALL_DAYS.indexOf(S.settings.days[di])));
}
function nextWorkingDate(){
  const now = new Date();
  for(let i=0; i<8; i++){ const d = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i)); if(dayIdxOfDate(d) >= 0) return d; }
  return iso(now);
}

// ---------- Roles ----------
const isAdmin = () => ROLE && ROLE.type === 'admin';
const myDept = () => S.departments.find(d => d.name === ROLE.dept) || {};
const myPages = () => Object.keys(PAGES).filter(k => PAGES[k].roles.includes(ROLE.type));
function inScope(listName, x){
  if(isAdmin()) return true;
  if(listName === 'teachers' || listName === 'classes') return x.dept === ROLE.dept;
  if(listName === 'subjects') return (byId(S.classes, x.classId)||{}).dept === ROLE.dept;
  return false;
}
function loginAdmin(){
  if(document.getElementById('apin').value !== String(S.settings.adminPin)) return loginMsg('Wrong admin PIN.');
  ROLE = {type:'admin'}; page = 'setup'; saveRole(); render();
}
function loginDept(){
  const name = document.getElementById('ddept').value, d = S.departments.find(x => x.name === name);
  if(!d || document.getElementById('dpin').value !== String(d.pin)) return loginMsg('Wrong department PIN.');
  ROLE = {type:'dept', dept:name}; page = 'teachers'; saveRole(); render();
}
function loginViewer(){ ROLE = {type:'viewer'}; saveRole(); render(); }
function loginMsg(m){ document.getElementById('loginMsg').innerHTML = `<div class="msg bad center">${esc(m)}</div>`; }
function logout(){ ROLE = null; saveRole(); render(); }

// ---------- Shell ----------
function go(id){ page = id; render(); window.scrollTo(0,0); }
function render(){
  const root = document.getElementById('root');
  if(SHARED){ root.innerHTML = sharedPage(); return; }
  if(!ROLE){ root.innerHTML = pageLogin(); return; }
  if(ROLE.type === 'viewer'){ root.innerHTML = viewerPage(); return; }
  if(ROLE.type === 'dept' && !S.departments.some(d => d.name === ROLE.dept)){ logout(); return; }
  if(!myPages().includes(page)) page = myPages()[0];
  const fn = {setup:pageSetup, rooms:pageRooms, teachers:pageTeachers, classes:pageClasses, subjects:pageSubjects, tracks:pageTracks,
              result:pageResult, subs:pageSubs, versions:pageVersions, share:pageShare}[page];
  root.innerHTML = `<div class="layout"><aside class="rail">${rail()}</aside><main>${fn()}</main></div>`;
  if(page === 'share') drawQR();
}
function rail(){
  const groups = {};
  myPages().forEach(k => (groups[PAGES[k].g] = groups[PAGES[k].g] || []).push(k));
  const open = openAbsences().length;
  return `<div class="brand">TimeWeave</div>
    <div class="who">${isAdmin() ? 'College admin' : esc(ROLE.dept) + ' department'}<small>${esc(S.settings.college || 'Your college')}</small></div>
    ${Object.entries(groups).map(([g, ks]) => `<div class="rg">${g}</div>` + ks.map(k =>

// cols: {f, label, type:'text'|'number'|'select', opts:()=>[[value,label]], w, ph}
function editTable(listName, cols, extra){
  const list = S[listName].filter(x => inScope(listName, x));
  const rows = list.map(item => `<tr>${cols.map(c => `<td style="${c.w?'width:'+c.w:'min-width:150px'}">${field(listName, item, c)}</td>`).join('')}
    ${extra ? `<td style="width:1%">${extra(item)}</td>` : ''}
    <td style="width:36px"><button class="x" title="Remove" onclick="removeRow('${listName}','${item.id}')">×</button></td></tr>`).join('');
  return `<div style="overflow-x:auto"><table><thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}${extra?'<th></th>':''}<th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${cols.length+2}" class="empty">Nothing here yet — add the first one below.</td></tr>`}</tbody></table></div>`;
}
function field(listName, item, c){
  if(c.show && !c.show(item)) return '<span class="muted">—</span>';
  const on = `onchange="setField('${listName}','${item.id}','${c.f}',this.value,'${c.type||'text'}')"`;
  if(c.type === 'select')
    return `<select ${on}>${c.opts().map(([v,l]) => `<option value="${esc(v)}" ${String(item[c.f]??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<input type="${c.type||'text'}" ${c.type==='number'?'min="0"':''} value="${esc(item[c.f])}" placeholder="${esc(c.ph||'')}" ${on}>`;
}
function setField(listName, id, f, v, type){
  const it = byId(S[listName], id); if(!it) return;
  if(listName === 'departments' && f === 'name'){
    const old = it.name;
    [...S.classes, ...S.teachers, ...S.rooms].forEach(x => { if(x.dept === old) x.dept = v; });
  }
  it[f] = type === 'number' ? Number(v) : v;
  if(listName === 'departments' && f !== 'name'){ save(); return; }
  changed();
  if(listName === 'subjects' && f === 'type'){ it.length = v === 'Lab' ? 2 : 1; render(); }
  if(listName === 'departments') render();
}
function addRow(listName, obj){ S[listName].push(Object.assign({id:uid()}, obj)); changed(); render(); }
function removeRow(listName, id){
  if(listName === 'departments'){ const d = byId(S.departments, id); if(d && !confirm(`Remove ${d.name || 'this'} department? Its classes and teachers stay.`)) return; }
  S[listName] = S[listName].filter(x => x.id !== id); changed(); render();
}

// An elective is known by its short code, the first word of its name ("SC L", "SC Lab P" → SC).
const codeOf = s => ((s && (s.raw || s.name)) || '').trim().split(/\s+/)[0].toUpperCase();
// Which group of students takes it, from the website's group names (D3 CS A2 → "2").
const digitOf = s => s && s.groupNames ? ((s.groupNames[0] || '').match(/(\d+)$/) || [])[1] || '' : '';
const trackClass = c => !!c && (S.tracks.prefixes || '').split(',').map(t => t.trim()).filter(Boolean).some(p => (c.name || '').startsWith(p));
const trackOf = s => S.tracks.map[codeOf(s)] || [];
function electiveCodes(){
  const ids = new Set(S.classes.filter(trackClass).map(c => c.id)), codes = {};
  S.subjects.filter(s => s.groups && s.groups.some(g => ids.has(g.classId))).forEach(s => (codes[codeOf(s)] = codes[codeOf(s)] || new Set()).add(s.raw || s.name));
  return codes;
}
function pageTracks(){
  const T = S.tracks, codes = electiveCodes();
  const years = [...new Set(S.classes.filter(trackClass).map(c => c.name.split(' ')[0]))];
  const warns = [];

    const ids = new Set(S.classes.filter(c => c.name.split(' ')[0] === y).map(c => c.id));
    const here = new Set(S.subjects.filter(s => s.groups && s.groups.some(g => ids.has(g.classId))).map(codeOf));
    T.list.forEach(t => { if(![...here].some(k => (T.map[k] || []).includes(t.id))) warns.push(`${t.name} has no elective ticked in ${y}.`); });
  });
  const rows = Object.entries(codes).sort((a, b) => a[0].localeCompare(b[0])).map(([k, names]) => `<tr>
    <td><b>${esc(k)}</b><br><small class="muted">${esc([...names].join(', '))}</small></td>
    ${T.list.map(t => `<td style="text-align:center"><input type="checkbox" style="width:auto" ${(T.map[k] || []).includes(t.id) ? 'checked' : ''} onchange="toggleTrack('${esc(k)}','${t.id}',this.checked)"></td>`).join('')}
    <td><small class="muted">${(T.map[k] || []).length ? '' : 'Everyone takes it'}</small></td></tr>`).join('');
  return pageHead('Tracks', 'From 3rd year, students follow a track. Tick the track each elective in the timetable belongs to. Students then pick their track on their phone and see only their own electives.') + `
  <div class="card flat row"><div><b>Tracks apply to</b><div class="muted">Classes whose name starts with these (comma separated). 2nd year is not included.</div></div>
    <input style="max-width:200px" value="${esc(T.prefixes)}" onchange="S.tracks.prefixes=this.value;save();render()"></div>
  <div class="card"><h3>Electives in your timetable</h3>
    ${Object.keys(codes).length ? `<div style="overflow-x:auto"><table><thead><tr><th>Elective</th>${T.list.map(t => `<th style="text-align:center" title="${esc(t.name)}">${esc(t.short)}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="muted">No electives found yet. Import or add the timetable of a class listed above.</p>'}
    <p class="muted" style="font-size:13px;margin-bottom:0">SC and CV are Machine Intelligence as you told us; the other ticks are suggestions, so please check them. An elective with no tick is shown to every student.</p>
    ${warns.map(w => `<div class="msg warn">${esc(w)}</div>`).join('')}
  </div>
  <div class="card"><h3>Tracks and their courses</h3><div class="grid2">${T.list.map(t => `<div><b>${esc(t.name)}</b>
    <ul class="muted" style="margin:6px 0 0;padding-left:18px;font-size:13px">${t.courses.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}</div></div>
  ${nextBtns()}`;
}
function toggleTrack(code, id, on){
  const m = S.tracks.map, list = new Set(m[code] || []);
  on ? list.add(id) : list.delete(id);
  m[code] = [...list]; if(!m[code].length) delete m[code];
  save(); render();
}
// Group choices a student needs when their track's elective runs in more than one group (e.g. GAI Group A / Group B).
function trackGroupOptions(c, track){
  const byCode = {};
  if(!track) return {};
  S.subjects.filter(s => s.groups && s.groups.some(g => g.classId === c.id) && trackOf(s).includes(track)).forEach(s => {
    const dg = digitOf(s); if(!dg) return;
    const o = byCode[codeOf(s)] = byCode[codeOf(s)] || {}; (o[dg] = o[dg] || []).push(s.raw || s.name);
  });
  const out = {};
  Object.entries(byCode).forEach(([k, byDigit]) => { const ds = Object.keys(byDigit).sort(); if(ds.length > 1)
    out[k] = ds.map(dg => ({digit:dg, label:`${byDigit[dg].find(n => !/lab/i.test(n)) || 'Group ' + dg} · ${(c.name || '').split(' ').pop()}${dg}`})); });

}
// Keeps a lesson in a student's view. Electives (3rd year on) follow the chosen track and group; every other lesson
// given to only part of the class (a batch, a lab group) follows the chosen subsection, e.g. B1.
function trackKeeps(x, by, id, pick){
  if(by !== 'class' || !pick) return true;
  const s = byId(S.subjects, x.subjectId), tr = trackClass(byId(S.classes, id)) ? trackOf(s) : [];
  if(tr.length){
    if(!pick.track) return true;
    if(!tr.includes(pick.track)) return false;

// The subsections of a class that its lessons are split into (B1, B2…), electives of a track year left out.
function subsectionsOf(c){

    if(tracked && trackOf(byId(S.subjects, x.subjectId)).length) return;

const subName = (c, letter) => (S.importInfo ? (c.name || '').split(' ').pop() + ('ABCDEFGH'.indexOf(letter) + 1) : 'Batch ' + letter);

function importSheet(e){
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(/\.xlsx?$/i.test(f.name)){
    if(!window.XLSX) return toast('Excel files need internet. Save the sheet as CSV and try again.');
    f.arrayBuffer().then(buf => { const wb = XLSX.read(buf); applyImport(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''})); });
  } else f.text().then(t => applyImport(parseCSV(t)));
}
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(v => String(v).trim())).map(r => Object.fromEntries(head.map((h,i) => [h, r[i] ?? ''])));
}
function applyImport(rows){
  const norm = o => { const m = {}; for(const k in o) m[k.toLowerCase().replace(/[^a-z]/g,'')] = String(o[k]).trim(); return m; };
  let nc = 0, nt = 0, ns = 0, skipped = 0;
  const ensureDept = name => { if(name && !S.departments.some(d => d.name === name)) S.departments.push({id:uid(), name, head:'', pin:String(1000+Math.floor(Math.random()*9000)), ready:false}); };
  rows.map(norm).forEach(r => {
    let dept = r.department || r.dept || '';
    if(!isAdmin()){ if(dept && dept !== ROLE.dept){ skipped++; return; } dept = ROLE.dept; }
    if(!r.class || !r.subject || !r.teacher){ skipped++; return; }
    const tdept = r.teacherdepartment || r.teacherdept || dept;
    if(isAdmin()){ ensureDept(dept); ensureDept(tdept); }
    let c = S.classes.find(x => x.name === r.class);
    if(!c){ c = {id:uid(), name:r.class, dept, size:+r.students || 60, breakAt:'auto'}; S.classes.push(c); nc++; }
    let t = S.teachers.find(x => x.name === r.teacher);
    if(!t){ t = {id:uid(), name:r.teacher, dept:tdept, maxPerDay:4, pref:'any', off:[]}; S.teachers.push(t); nt++; }
    const lab = /lab|prac/i.test(r.kind || '');
    S.subjects.push({id:uid(), classId:c.id, name:r.subject, teacherId:t.id, type:lab ? 'Lab' : 'Theory',
      perWeek:+(r.timesperweek || r.perweek) || (lab ? 1 : 3), length:+(r.periodseach || r.length) || (lab ? 2 : 1)});
    ns++;
  });
  changed(); render();
  toast(`Added ${nc} classes, ${nt} teachers, ${ns} subjects${skipped ? ` · skipped ${skipped} rows` : ''}`);
}

// ---------- Import from FET ----------
// FET is free timetabling software used by many colleges; its "groups_days_horizontal" HTML export lists every lesson.
// The sections you pick are re-scheduled by TimeWeave. Everything else (other years, electives shared across
// sections, projects) stays exactly where it is: those hours are blocked for the teachers, rooms and classes involved.
const FET_DAYS = {Monday:'Mon', Tuesday:'Tue', Wednesday:'Wed', Thursday:'Thu', Friday:'Fri', Saturday:'Sat'};
const fc = s => String(s || '').replace(/\s+/g, ' ').trim();
const fsplit = s => fc(s).split(/\s*,\s*/).filter(Boolean);
const isGroupList = s => /^(D\d+|M\d+|PHD)\s+\S+/i.test(s);
const mostCommon = arr => { const n = {}; arr.forEach(v => n[v] = (n[v] || 0) + 1); return Object.entries(n).sort((a,b) => b[1] - a[1])[0][0]; };
let FET = null;

function fetCell(td, owner){
  const txt = fc(td.textContent);
  if(!txt || txt === '---') return {kind:'free'};
  if(txt === '-x-') return {kind:'break'};
  const det = td.querySelector('table.detailed');
  if(det){
    const rows = [...det.querySelectorAll('tr')].map(r => [...r.children].map(c => fc(c.textContent)));
    return {kind:'lesson', entries:rows[0].map((g, i) => ({groups:fsplit(g), subject:rows[1]?.[i] || '', teachers:fsplit(rows[2]?.[i] || ''), room:rows[3]?.[i] || ''}))};
  }
  const parts = td.innerHTML.split(/<br\s*\/?>/i).map(s => fc(s.replace(/<[^>]+>/g, ''))).filter(Boolean);
  let groups = [owner];
  if(parts.length > 1 && isGroupList(parts[0])) groups = fsplit(parts.shift());
  else if(parts.length >= 4 && /^(D\d+|M\d+|PHD)$/i.test(parts[0])) parts.shift();   // short label of the owner group, e.g. "M1"
  const looksTeacher = s => /\b(Dr|Pf|Prof|Mr|Ms|Mrs)\.|\(/.test(s);
  const subject = parts[0] || '';
  const teacher = parts.length >= 3 ? parts[1] : parts.length === 2 && looksTeacher(parts[1]) ? parts[1] : '';
  const room = parts.length >= 3 ? parts[parts.length - 1] : parts.length === 2 && !looksTeacher(parts[1]) ? parts[1] : '';
  return {kind:'lesson', entries:[{groups, subject, teachers:fsplit(teacher), room}]};
}
function parseFET(html){
  const doc = new DOMParser().parseFromString(html, 'text/html'), groups = [];
  doc.querySelectorAll('table[id]').forEach(t => {
    const name = fc(t.querySelector('thead th[colspan]')?.textContent); if(!name) return;
    const days = [...t.querySelectorAll('thead th.xAxis')].map(th => fc(th.textContent));
    const rows = [...t.querySelectorAll(':scope > tbody > tr')].filter(tr => tr.querySelector(':scope > th'));
    const slots = rows.map(tr => fc(tr.querySelector(':scope > th').textContent));
    const grid = slots.map(() => Array(days.length).fill(null));
    rows.forEach((tr, r) => {
      let col = 0;
      [...tr.children].filter(c => c.tagName === 'TD').forEach(td => {
        while(col < days.length && grid[r][col]) col++;     // skip cells filled by a rowspan from above
        const cell = fetCell(td, name);
        for(let k=0; k<(td.rowSpan || 1) && r + k < slots.length; k++) grid[r+k][col] = cell;
        col++;
      });
    });
    groups.push({name, days, slots, grid});
  });
  return {institution:fc(doc.querySelector('caption')?.textContent) || '', groups};
}
function openFET(e){
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  f.text().then(html => fetPicker(html, f.name));
}
function fetPicker(html, source){
  const parsed = parseFET(html);
  if(!parsed.groups.length) return toast('No FET timetable found in that file. Use the "groups" / students HTML export.');
  FET = {...parsed, source};
  const years = {};
  parsed.groups.forEach(g => (years[g.name.split(' ')[0]] = years[g.name.split(' ')[0]] || []).push(g.name));
  document.getElementById('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">
    <h3>Import timetable</h3><p class="muted">${esc(parsed.institution)} · ${parsed.groups.length} groups found in ${esc(source)}.
      Pick the classes TimeWeave should schedule. Everything else is kept exactly as it is and blocks those teachers and rooms.</p>
    ${Object.entries(years).map(([y, names]) => `<div style="margin:14px 0"><label class="f"><input type="checkbox" style="width:auto" ${y === 'D2' ? 'checked' : ''}
        onchange="document.querySelectorAll('.fetg[data-y=\\'${esc(y)}\\']').forEach(i=>i.checked=this.checked)"> <b>${esc(y)}</b> · ${names.length} groups</label>
      <div class="chips">${names.map(n => `<label class="chip"><input type="checkbox" class="fetg" data-y="${esc(y)}" value="${esc(n)}" style="width:auto" ${y === 'D2' ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div></div>`).join('')}
    <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn hot" onclick="fetRun()">Import</button></div></div></div>`;
}
function fetRun(){
  const chosen = new Set([...document.querySelectorAll('.fetg:checked')].map(i => i.value));
  if(!chosen.size) return toast('Pick at least one class.');
  if((S.subjects.length || S.classes.length) && !confirm('This replaces your current data with the imported timetable. Continue?')) return;
  const rep = fetImport(FET, chosen);
  document.getElementById('modal').innerHTML = '';
  go('setup');
  toast(`Imported ${rep.classes} classes, ${rep.teachers} teachers, ${rep.subjects} subjects, ${rep.rooms} rooms`);
}
function fetImport(fet, chosen){
  const groups = fet.groups, g0 = groups[0];
  const mins = s => { const [h, m] = s.trim().split(':').map(Number); return h*60 + m; };
  const [a, b] = g0.slots[0].split('-');
  const D = blank();
  if(S.tracks) D.tracks = S.tracks;   // keep the admin's track mapping across re-imports
  Object.assign(D.settings, {college:(fet.institution || 'Imported college') + ' · CSE', days:g0.days.map(d => FET_DAYS[d] || d.slice(0,3)),
    periods:g0.slots.length, start:a.trim(), length:mins(b) - mins(a), maxStreak:S.settings.maxStreak, adminPin:S.settings.adminPin});
  // Some years list each batch as its own table (D1 CS A1, D1 CS A2) with no table for the section itself;
  // those tables are joined into one section ("D1 CS A") whose batches they become.
  const names = new Set(groups.map(g => g.name)), base = g => g.replace(/\d+$/, '');
  const parentOf = g => base(g) !== g && !names.has(base(g)) && [...chosen].some(n => n !== g && base(n) === base(g)) ? base(g) : g;
  const sections = new Set([...chosen].map(parentOf));
  const sectionOf = g => chosen.has(g) ? parentOf(g) : sections.has(base(g)) ? base(g) : null;
  const batchOf = (g, sec) => g === sec ? '' : 'ABCDEFGH'[(+g.slice(sec.length) || 1) - 1];
  const subgroups = {};
  groups.forEach(g => g.grid.flat().forEach(cell => cell && cell.kind === 'lesson' && cell.entries.forEach(e => e.groups.forEach(n => {
    const s = sectionOf(n); if(s && n !== s) (subgroups[s] = subgroups[s] || new Set()).add(n); }))));
  [...chosen].forEach(n => { const s = parentOf(n); if(s !== n) (subgroups[s] = subgroups[s] || new Set()).add(n); });

  // 1. Unique lessons: the same lesson shows up in the table of every group taking it.
  const lessons = new Map(), breaks = {};
  groups.forEach(g => g.grid.forEach((row, p) => row.forEach((cell, d) => {
    if(!cell) return;
    if(cell.kind === 'break' && chosen.has(g.name)) (breaks[sectionOf(g.name)] = breaks[sectionOf(g.name)] || []).push({d, p});
    if(cell.kind !== 'lesson') return;
    cell.entries.forEach(e => { const k = [d, p, e.subject, e.teachers.join('+'), e.room, e.groups.join('+')].join('|'); if(!lessons.has(k)) lessons.set(k, {d, p, ...e}); });
  })));

  // 2. A lesson for one chosen class (or one of its batches) with one teacher and a room is re-scheduled; anything else is fixed.
  const sched = [], fixed = {}, tOff = {}, rOff = {};
  const block = (map, key, sl) => { if(key) (map[key] = map[key] || new Set()).add(sl); };
  lessons.forEach(L => {
    const sl = L.d + '-' + L.p, secs = [...new Set(L.groups.map(sectionOf))];
    // Up to two teachers (a teacher plus a co-teacher) can be re-scheduled; bigger panels, like project reviews, stay fixed.
    // One section only: a single group is the whole class or one batch; all of its batches together are the whole class.
    const sec = secs.length === 1 ? secs[0] : null, subs = sec && subgroups[sec] ? subgroups[sec] : new Set();
    const batch = !sec ? null : L.groups.length === 1 ? batchOf(L.groups[0], sec)
      : L.groups.every(n => subs.has(n)) && L.groups.length === subs.size ? '' : null;
    const teach = L.teachers.length >= 1 && L.teachers.length <= 2 && L.room;
    const who = {teacher:L.teachers[L.teachers.length - 1], co:L.teachers.length > 1 ? L.teachers[0] : ''};
    if(batch !== null && teach) sched.push({...L, ...who, section:sec, batch});
    // Combined lesson: groups from several sections together, e.g. a 4th-year track (A1+B1+C1+D1+E1) or an elective.
    else if(teach && secs.every(Boolean)){
      const occ = L.groups.map(n => { const s = sectionOf(n); return {section:s, batch:n === s ? '' : batchOf(n, s)}; });
      sched.push({...L, ...who, section:occ[0].section, batch:'', occ, gkey:L.groups.join('+')});
    }
    else {
      secs.filter(Boolean).forEach(s => { const m = fixed[s] = fixed[s] || {}; (m[sl] = m[sl] || []).push(L); });
      L.teachers.forEach(t => block(tOff, t, sl)); block(rOff, L.room, sl);
    }
  });

  // The same lesson written once per batch table (same time, teacher and room for every batch) is one whole-class lesson.

  Object.values(same).forEach(list => {
    if(list.length > 1 && list.length === (subgroups[list[0].section] || new Set()).size){ list.slice(1).forEach(L => sched.splice(sched.indexOf(L), 1)); list[0].batch = ''; }
  });
  // 3. Back-to-back periods of the same lesson become one longer lesson (labs are usually 2 periods).
  sched.sort((x, y) => x.section.localeCompare(y.section) || x.batch.localeCompare(y.batch) || x.subject.localeCompare(y.subject)

  const sessions = [];
  sched.forEach(L => {
    const last = sessions[sessions.length - 1];
    if(last && last.section === L.section && last.batch === L.batch && last.subject === L.subject && last.teacher === L.teacher && last.co === L.co && last.gkey === L.gkey && last.room === L.room && last.d === L.d && last.p + last.len === L.p) last.len++;

  });

  // 4. Rooms, teachers, classes and subjects. Seats and class sizes are not published, so sensible defaults are used.
  const ids = {}, idOf = (kind, name) => ids[kind + name] = ids[kind + name] || uid();
  D.rooms = [...new Set(sessions.map(s => s.room))].map(n => ({id:idOf('r', n), name:n, type:/LAB/i.test(n) ? 'Lab' : 'Classroom', capacity:/LAB/i.test(n) ? 36 : 72, dept:'', off:[...(rOff[n] || [])]}));
  const perDay = {}; sessions.forEach(s => [s.teacher, s.co].filter(Boolean).forEach(n => perDay[n + '|' + s.d] = (perDay[n + '|' + s.d] || 0) + s.len));
  D.teachers = [...new Set(sessions.flatMap(s => [s.teacher, s.co]).filter(Boolean))].map(n => ({id:idOf('t', n), name:n, dept:/App\.? ?Sci/i.test(n) ? 'App. Sci.' : 'CSE',
    maxPerDay:Math.max(4, ...Object.entries(perDay).filter(([k]) => k.startsWith(n + '|')).map(([, v]) => v)), pref:'any', off:[...(tOff[n] || [])]}));
  // "-x-" marks any hour a class is unavailable. The break is the "-x-" hour that falls between the class's lessons
  // on most days; every other "-x-" hour is kept as a fixed "Not available" hour.
  const busyAt = {};
  sessions.forEach(s => (s.occ ? [...new Set(s.occ.map(o => o.section))] : [s.section]).forEach(sec => {
    for(let k=0; k<s.len; k++) (busyAt[sec+'|'+s.d] = busyAt[sec+'|'+s.d] || new Set()).add(s.p + k); }));
  Object.entries(fixed).forEach(([s, m]) => Object.keys(m).forEach(sl => { const [d, p] = sl.split('-').map(Number); (busyAt[s+'|'+d] = busyAt[s+'|'+d] || new Set()).add(p); }));
  // Breaks differ from day to day in real timetables, so each "-x-" hour is kept exactly where it is.

  // Fixed hours keep what the website shows: subject, groups, teachers and room.
  const short = gs => gs.map(g => g.split(' ').pop()).join(', ');
  D.classes = [...sections].map(n => {
    const f = Object.entries(fixed[n] || {}).map(([sl, list]) => ({sl, label:[...new Set(list.map(L => L.subject))].join(' / '),
      sub:list.map(L => [short(L.groups), L.teachers.join(', '), L.room].filter(Boolean).join(' · ')).join(' | ')}));
    (breaks[n] || []).forEach(({d, p}) => { if(!f.some(x => x.sl === d+'-'+p)) f.push({sl:d+'-'+p, label:inside(n, d, p) ? 'Break' : 'Not available'}); });
    return {id:idOf('c', n), name:n, dept:'CSE', size:60, breakAt:'auto', fixed:f};
  });
  Object.assign(D.settings, {breakMode:'same', breakAfter:0, breakSlots:[]});

  const nice = s => s.replace(/\s+L\.?$/, '').replace(/\s+T\.?$/, ' Tutorial').replace(/\s+P\.?$/, '').trim();
  const maxBatch = {}; sessions.forEach(s => { if(s.batch) maxBatch[s.section] = Math.max(maxBatch[s.section] || 1, 'ABCDEFGH'.indexOf(s.batch) + 1); });
  const bySub = {}; sessions.forEach(s => { const k = s.section + '\u0001' + s.subject + '\u0001' + (s.occ ? 'j' + s.gkey + '|' + s.teacher : s.batch ? 'b' : 'w'); (bySub[k] = bySub[k] || []).push(s); });
  const groupLabel = occ => { const ls = [...new Set(occ.map(o => o.batch))];
    return ls.length === 1 && ls[0] ? 'group ' + ('ABCDEFGH'.indexOf(ls[0]) + 1) : ls.every(l => !l) ? 'combined' : 'mixed groups'; };
  const roomCap = n => (D.rooms.find(r => r.name === n) || {}).capacity || 60;
  const official = [];
  Object.entries(bySub).forEach(([k, list]) => {
    const [section, raw, kind] = k.split('\u0001'), c = D.classes.find(x => x.name === section);
    const by = {}; list.forEach(s => (by[s.batch] = by[s.batch] || []).push(s));
    const letters = Object.keys(by).sort(), teacherOf = l => mostCommon(by[l].map(s => s.teacher));
    const subj = {id:uid(), classId:c.id, name:nice(raw), type:/lab/i.test(raw) || /\sP\.?$/.test(raw) ? 'Lab' : 'Theory',
      perWeek:Math.max(...letters.map(l => by[l].length)), length:+mostCommon(list.map(s => s.len)), teacherId:idOf('t', teacherOf(letters[0])), teacherB:'', batches:0,
      raw, groupNames:list[0].occ ? list[0].groups : undefined};
    const cos = list.map(s => s.co).filter(Boolean);
    subj.coTeacher = cos.length ? idOf('t', mostCommon(cos)) : '';
    if(kind[0] === 'j'){
      // Students from several sections; its size is taken from the room it used, since group sizes are not published.
      subj.name = `${nice(raw)} · ${groupLabel(list[0].occ)}`;
      subj.groups = list[0].occ.map(o => ({classId:idOf('c', o.section), batch:o.batch}));
      subj.size = roomCap(mostCommon(list.map(s => s.room)));
    }
    if(kind === 'b'){
      subj.batches = maxBatch[section] || 2;
      if(letters[1] && teacherOf(letters[1]) !== teacherOf(letters[0])) subj.teacherB = idOf('t', teacherOf(letters[1]));
    }
    D.subjects.push(subj);
    list.forEach(s => official.push({subjectId:subj.id, classId:c.id, teacherId:idOf('t', s.teacher), coTeacherId:s.co ? idOf('t', s.co) : '', roomId:idOf('r', s.room), day:s.d, period:s.p, len:s.len,
      batch:s.batch, size:subj.size || (s.batch ? Math.ceil(c.size / subj.batches) : c.size), occ:subj.groups}));

    const k = [x.day, x.period, x.len, year].join('|'); (together[k] = together[k] || new Set()).add(x.subjectId);
  });
  Object.values(together).forEach(set => { const [a, ...rest] = [...set]; rest.forEach(b => { parent[find(b)] = find(a); }); });
  D.subjects.forEach(s => { if(s.groups) s.block = find(s.id); });
  D.departments = [...new Set([...D.classes.map(c => c.dept), ...D.teachers.map(t => t.dept)])].map(n => ({id:uid(), name:n, head:'', pin:String(1000 + Math.floor(Math.random()*9000)), ready:true}));
  const fixedCount = D.classes.reduce((n, c) => n + c.fixed.length, 0);
  D.importInfo = {source:fet.source, at:new Date().toLocaleString(), classes:D.classes.length, lessons:official.length, fixed:fixedCount};

  // 5. Keep the official timetable as a version so TimeWeave's result can be compared with it.
  S = D;
  // needed = what the official timetable actually holds (batches may meet a different number of times).
  const R = {placed:official, needed:official.length, unplaced:[], breaks:classBreaks(), warns:[], at:'imported from ' + fet.source, stamp:dataStamp()};
  S.versions = [{id:uid(), name:'Official timetable (imported)', at:new Date().toLocaleString(), result:R, stamp:R.stamp, m:metrics(R)}];
  S.result = JSON.parse(JSON.stringify(R));
  save();
  return {classes:D.classes.length, teachers:D.teachers.length, subjects:D.subjects.length, rooms:D.rooms.length};
}

// ---------- Checks before generating ----------
function precheck(){
  const st = S.settings, errs = [], warns = [], slots = st.days.length * st.periods;
  const classSlots = st.days.length * (st.periods - (staggered() ? 1 : 0));
  if(!st.days.length) errs.push('Pick at least one working day.');
  if(!S.subjects.length) errs.push('Add some subjects first.');
  S.rooms.filter(r => !(+r.capacity > 0)).forEach(r => errs.push(`Room "${r.name || 'unnamed'}" has no capacity. Enter how many students it seats.`));
  S.classes.filter(c => !(+c.size > 0)).forEach(c => errs.push(`Class "${c.name || 'unnamed'}" has no student count.`));
  S.subjects.forEach(s => {
    const c = byId(S.classes, s.classId), t = byId(S.teachers, s.teacherId), nm = `"${s.name || 'unnamed subject'}"`;
    if(!c) errs.push(`${nm} has no class chosen.`);
    if(!t) errs.push(`${nm} has no teacher chosen.`);
    if(c){
      const rooms = S.rooms.filter(r => r.type === (s.type === 'Lab' ? 'Lab' : 'Classroom') && (!r.dept || r.dept === c.dept));
      if(!rooms.length) errs.push(`No ${s.type === 'Lab' ? 'lab' : 'classroom'} is open to ${c.name} (${c.dept || 'no department'}) for ${nm}.`);
      else { const size = +s.size || Math.ceil(c.size / batchesOf(s, c));
        if(!rooms.some(r => +r.capacity >= size)) errs.push(`No ${s.type === 'Lab' ? 'lab' : 'room'} is big enough for ${c.name} (${size} students${size < c.size ? ' per batch' : ''}).`); }
    }
  });
  S.classes.forEach(c => {
    // Combined lessons (tracks, electives) run side by side for different groups, so only the class's own lessons are added up.
    const need = S.subjects.filter(s => s.classId === c.id && !s.groups).reduce((a,s) => a + s.perWeek * (s.length || 1), 0);
    const brk = staggered() && classBreaks()[c.id] != null ? st.days.length : 0;
    const room = slots - brk - (c.fixed || []).length;
    if(need > 0 && need > room) errs.push(`${c.name} needs ${need} periods but the week only has ${room} free (after breaks${(c.fixed || []).length ? ' and fixed hours' : ''}).`);
  });
  const sessions = expandSessions();
  S.teachers.forEach(t => {
    const need = sessions.filter(x => x.teacherId === t.id).reduce((a,x) => a + x.len, 0);
    const free = Math.min(slots - (t.off || []).length, st.days.length * (t.maxPerDay || st.periods));
    if(need > free) errs.push(`${t.name} has ${need} periods to teach but is free for only ${free}.`);
    else if(need && need > free * 0.85) warns.push(`${t.name} is very busy (${need} of ${free} free periods).`);
  });
  const notReady = S.departments.filter(d => !d.ready).map(d => d.name);
  if(notReady.length) warns.push(`Not marked ready yet: ${notReady.join(', ')}. You can still make the timetable.`);
  return {errs:[...new Set(errs)], warns};
}

// ---------- Scheduler ----------
// Strict: no teacher/class/room double-booking, time off, max per day, room type/size/department,
//         each class keeps its break free, labs never split by a break.
// Wishes: finish early, no empty gaps, teacher preferences, subject spread over the week, light days, best-fit room.
function prefBroken(pref, p, len){
  const st = S.settings, P = st.periods, mid = st.breakMode === 'same' && st.breakAfter > 0 ? st.breakAfter : Math.ceil(P/2);
  if(pref === 'nofirst') return p === 0;
  if(pref === 'nolast') return p + len === P;
  if(pref === 'morning') return p + len > mid;
  if(pref === 'afternoon') return p < mid;
  return false;
}
// Splits classes evenly across the allowed break times (fixed choices first), so rooms stay in use during breaks.
function classBreaks(){
  const out = {};
  if(!staggered()) return out;
  const slots = S.settings.breakSlots, count = {};
  slots.forEach(s => count[s] = 0);
  S.classes.forEach(c => { if(c.breakAt != null && c.breakAt !== 'auto' && slots.includes(+c.breakAt)){ out[c.id] = +c.breakAt; count[+c.breakAt]++; } });
  S.classes.filter(c => out[c.id] == null)
    .sort((a,b) => (a.dept || '').localeCompare(b.dept || '') || (a.name || '').localeCompare(b.name || ''))
    .forEach(c => { const s = slots.reduce((a,b) => count[b] < count[a] ? b : a); out[c.id] = s; count[s]++; });
  return out;
}
// A lab is split into batches when the class is bigger than every lab it may use (or into as many as the admin asked for).
function batchesOf(s, c){
  if(!s || !c || s.groups) return 1;
  if(+s.batches > 0) return +s.batches;
  if(s.type !== 'Lab') return 1;
  const cap = Math.max(0, ...S.rooms.filter(r => r.type === 'Lab' && (!r.dept || r.dept === c.dept)).map(r => +r.capacity || 0));
  return cap && +c.size > cap ? Math.ceil(c.size / cap) : 1;
}
// One entry per lesson to place. Batch A gets the subject's teacher; other batches get the "other batch" teacher if set.
function expandSessions(){
  const out = [];
  S.subjects.forEach(s => {
    const c = byId(S.classes, s.classId); if(!c) return;
    const B = batchesOf(s, c), len = Math.max(1, s.length || 1);
    for(let i=0; i<s.perWeek; i++){
      const co = s.coTeacher && s.coTeacher !== s.teacherId ? s.coTeacher : '';
      if(B === 1) out.push({s, len, teacherId:s.teacherId, co, size:+s.size || +c.size, batch:'',
        occ:s.groups ? s.groups.map(g => ({classId:g.classId, batch:g.batch || ''})) : null});
      else for(let b=0; b<B; b++){ const t = b === 0 ? s.teacherId : (s.teacherB || s.teacherId); out.push({s, len, teacherId:t, co:co !== t ? co : '', size:Math.ceil(c.size / B), batch:'ABCDEFGH'[b]}); }
    }
  });
  return out;
}
// Teachers may not teach more than maxStreak periods back to back. A shared break ("everyone at once") resets the count.
function streakOK(isBusy, p, len){
  const st = S.settings, max = +st.maxStreak || 0;
  if(!max) return true;
  const same = st.breakMode === 'same' && st.breakAfter > 0;
  let run = len;
  for(let q = p-1; q >= 0 && isBusy(q) && !(same && q+1 === st.breakAfter); q--) run++;
  for(let q = p+len; q < st.periods && isBusy(q) && !(same && q === st.breakAfter); q++) run++;
  return run <= Math.max(max, len);
}
// Groups batch lessons of a class into rotation blocks, the way colleges run labs: while Batch A does one lab,
// Batch B does another (or the same lab with a second teacher) at the same time. Each block is placed as one unit.
function makeUnits(sessions){
  const units = [], byClass = {}, blocks = {};
  sessions.forEach(x => {
    if(x.s.block) (blocks[x.s.block] = blocks[x.s.block] || []).push(x);
    else if(!x.batch) units.push({members:[x], len:x.len});
    else (byClass[x.s.classId] = byClass[x.s.classId] || []).push(x);
  });
  // Blocks of combined lessons (tracks, electives): one lesson of each subject per unit, with no shared teacher or group.
  const overlap = (a, b) => [a.teacherId, a.co].some(t => t && (t === b.teacherId || t === b.co))
    || (a.occ || []).some(g => (b.occ || []).some(h => g.classId === h.classId && (!g.batch || !h.batch || g.batch === h.batch)));
  Object.values(blocks).forEach(list => {
    const bySubj = {}; list.forEach(x => (bySubj[x.s.id] = bySubj[x.s.id] || []).push(x));
    const ids = Object.keys(bySubj);
    while(ids.some(id => bySubj[id].length)){
      const members = [];
      ids.forEach(id => { const i = bySubj[id].findIndex(x => (!members.length || x.len === members[0].len) && !members.some(m => overlap(m, x)));
        if(i >= 0) members.push(bySubj[id].splice(i, 1)[0]); });
      units.push({members, len:members[0].len});
    }
  });
  Object.values(byClass).forEach(list => {
    const letters = [...new Set(list.map(x => x.batch))].sort(), pool = {};
    letters.forEach(l => pool[l] = list.filter(x => x.batch === l));
    letters.forEach(l => {
      while(pool[l].length){
        const first = pool[l].shift(), members = [first];
        letters.filter(o => o !== l).forEach(o => {
          const fits = pool[o].filter(y => y.len === first.len && !members.some(m => [m.teacherId, m.co].some(t => t && (t === y.teacherId || t === y.co))));
          const pick = fits.find(y => !members.some(m => m.s.id === y.s.id)) || fits[0];   // prefer a different lab (rotation)
          if(pick){ pool[o].splice(pool[o].indexOf(pick), 1); members.push(pick); }
        });
        units.push({members, len:first.len});
      }
    });
  });
  return units;
}
function makeTimetable(){
  const pc = precheck();
  if(pc.errs.length){ S.result = {errors:pc.errs, warns:pc.warns}; save(); go('result'); return; }
  const st = S.settings, D = st.days.length, P = st.periods, BR = classBreaks(), same = st.breakMode === 'same';
  const sessions = expandSessions(), units = makeUnits(sessions);
  units.forEach((u, i) => u.ix = i);
  const tLoad = {}; sessions.forEach(x => tLoad[x.teacherId] = (tLoad[x.teacherId] || 0) + x.len + ((byId(S.teachers, x.teacherId) || {}).off || []).length / 4);

  let best = null;
  const started = Date.now();
  for(let attempt=0; attempt<120; attempt++){
    if(best && Date.now() - started > 6000) break;   // big colleges: keep the best result found within ~6 seconds
    const order = units.map(u => ({...u, key:u.len*100 + u.members.length*60 + Math.max(...u.members.map(x => tLoad[x.teacherId])) + Math.random()*8})).sort((a,b) => b.key - a.key);
    // busy: whole-class, teacher and room slots. part: batch lessons sitting in a class slot (other batches may join if aligned).
    const busy = new Set(), part = {}, tDay = {}, subjDay = {}, placed = [], unplaced = [], leftUnits = [];
    S.classes.forEach(c => (c.fixed || []).forEach(f => busy.add('c'+c.id+f.sl)));   // hours kept from an imported timetable
    let cost = 0;
    for(const u of order){
      const len = u.len, c = byId(S.classes, u.members[0].s.classId), br = BR[c.id];
      const ms = u.members.map(x => ({x, t:byId(S.teachers, x.teacherId), ts:[x.teacherId, x.co].filter(Boolean).map(id => byId(S.teachers, id)),
        rooms:S.rooms.filter(r => r.type === (x.s.type === 'Lab' ? 'Lab' : 'Classroom') && +r.capacity >= x.size && (!r.dept || r.dept === c.dept))}));
      const groups = ms.flatMap(m => m.x.occ || [{classId:c.id, batch:m.x.batch}]);
      const occ = (d, q) => busy.has('c'+c.id+d+'-'+q) || !!part[c.id+'|'+d+'|'+q];
      let pick = null;
      for(let d=0; d<D; d++){
        if(ms.some(m => m.ts.some(t => (tDay[t.id+'|'+d] || 0) + len > (t.maxPerDay || P)))) continue;
        for(let p=0; p+len<=P; p++){
          if(same && st.breakAfter > 0 && p < st.breakAfter && p + len > st.breakAfter) continue;
          if(groups.some(g => { const b = BR[g.classId]; return b != null && p <= b && p + len > b; })) continue;
          let ok = true, parallel = false;
          for(let k=0; k<len && ok; k++){
            const sl = d+'-'+(p+k);
            // A whole class needs its slot empty; a batch or group may sit beside other batches if they line up.
            for(const g of groups){
              const pt = part[g.classId+'|'+d+'|'+(p+k)];
              if(busy.has('c'+g.classId+sl)) ok = false;
              else if(pt && !g.batch) ok = false;
              else if(pt){ if(pt.some(e => e.batch === g.batch)) ok = false; else parallel = true; }
            }
            for(const m of ms) for(const t of m.ts) if(busy.has('t'+t.id+sl) || (t.off || []).includes(sl)) ok = false;
          }
          if(!ok || ms.some(m => m.ts.some(t => !streakOK(q => busy.has('t'+t.id+d+'-'+q), p, len)))) continue;
          // One room per member, all different.
          const rooms = [], taken = new Set(); let roomCost = 0;
          for(const m of ms){
            let room = null, rc = 1e9;
            for(const r of m.rooms){
              if(taken.has(r.id)) continue;
              let free = true;
              for(let k=0; k<len; k++) if(busy.has('r'+r.id+d+'-'+(p+k)) || (r.off || []).includes(d+'-'+(p+k))){ free = false; break; }
              if(!free) continue;
              const cst = (r.dept ? 0 : 1.5) + (r.capacity - m.x.size) / 100;
              if(cst < rc){ rc = cst; room = r; }
            }
            if(!room){ rooms.length = 0; break; }
            rooms.push(room); taken.add(room.id); roomCost += rc;
          }
          if(rooms.length !== ms.length) continue;
          // A lesson next to an existing one (or next to the class's break with a lesson beyond it) leaves no gap.
          const before = p-1 === br ? p-2 : p-1, after = p+len === br ? p+len+1 : p+len;
          const dayBusy = range(P).some(q => occ(d, q)), touches = occ(d, before) || occ(d, after);
          const sc = (parallel ? -6 : 0) + (dayBusy && !touches && !parallel ? 4 : 0) + (p + len) * 0.9
                   + ms.reduce((a, m) => a + (subjDay[c.id+'|'+m.x.s.id+'|'+m.x.batch+'|'+d] || 0) * 40 + (tDay[m.t.id+'|'+d] || 0) * 1.2 + (prefBroken(m.t.pref, p, len) ? 6 : 0), 0)
                   + roomCost + Math.random() * 1.5;
          if(!pick || sc < pick.sc) pick = {d, p, rooms, sc};
        }
      }
      if(!pick){ u.members.forEach(x => unplaced.push(x.s.id + (x.batch ? ':' + x.batch : ''))); leftUnits.push(u); continue; }
      ms.forEach((m, i) => {
        const room = pick.rooms[i];
        for(let k=0; k<len; k++){
          const sl = pick.d+'-'+(pick.p+k);
          m.ts.forEach(t => busy.add('t'+t.id+sl)); busy.add('r'+room.id+sl);
          (m.x.occ || [{classId:c.id, batch:m.x.batch}]).forEach(g => {
            const key = g.classId+'|'+pick.d+'|'+(pick.p+k);
            if(g.batch) part[key] = (part[key] || []).concat({batch:g.batch, start:pick.p, len});
            else busy.add('c'+g.classId+sl);
          });
        }
        m.ts.forEach(t => tDay[t.id+'|'+pick.d] = (tDay[t.id+'|'+pick.d] || 0) + len);
        const sk = c.id+'|'+m.x.s.id+'|'+m.x.batch+'|'+pick.d; subjDay[sk] = (subjDay[sk] || 0) + 1;
        placed.push({subjectId:m.x.s.id, classId:c.id, teacherId:m.t.id, coTeacherId:m.x.co || '', roomId:room.id, day:pick.d, period:pick.p, len, batch:m.x.batch, size:m.x.size, unit:u.ix, ...(m.x.occ ? {occ:m.x.occ} : {})});
      });
      cost += pick.sc;
    }
    const total = unplaced.length * 1000 + cost + gapsOf(placed, BR) * 3;
    if(!best || total < best.total) best = {placed, unplaced, leftUnits, total};
    if(!unplaced.length && attempt > 40) break;
  }
  const left = best.leftUnits.map(u => u.members.map(x => ({subjectId:x.s.id, classId:x.s.classId, teacherId:x.teacherId, coTeacherId:x.co || '', roomId:'', day:-1, period:-1, len:u.len, batch:x.batch, size:x.size, unit:u.ix, ...(x.occ ? {occ:x.occ} : {})})));
  const done = improve(best.placed, BR, left);
  S.result = {placed:done.placed, unplaced:done.still.flatMap(ms => ms.map(m => m.subjectId + (m.batch ? ':' + m.batch : ''))), breaks:BR, warns:pc.warns, at:new Date().toLocaleString(), stamp:dataStamp()};
  S.absences.forEach(a => a.picks = {});
  save(); go('result'); toast('Timetable ready');
}
// Second pass: move each lesson (or rotation block) to the free slot that makes its class's days shortest and most
// compact, then try again to fit lessons the first pass could not place. Every strict rule is re-checked against
// all other lessons, so nothing that was valid becomes invalid.
function improve(placed, BR, leftovers = []){
  const st = S.settings, D = st.days.length, P = st.periods, same = st.breakMode === 'same';
  const classScore = (cid, list) => {
    const days = {}, seen = {}, br = BR[cid], fx = (byId(S.classes, cid) || {}).fixed || []; let s = 0;
    list.forEach(x => { for(let k=0; k<x.len; k++) (days[x.day] = days[x.day] || new Set()).add(x.period + k);
      const key = x.subjectId + (x.batch || '') + '|' + x.day; if(seen[key]) s += 40; seen[key] = 1; });
    Object.entries(days).forEach(([d, set]) => { const ps = [...set], lo = Math.min(...ps), hi = Math.max(...ps);
      const held = fx.filter(f => { const [fd, fp] = f.sl.split('-').map(Number); return fd === +d && fp > lo && fp < hi && fp !== br; }).length;
      s += ((hi - lo + 1) - ps.length - (br != null && br > lo && br < hi ? 1 : 0) - held) * 4 + hi + 1; });
    return s;
  };
  const roomFits = (r, m, c) => r.type === ((byId(S.subjects, m.subjectId) || {}).type === 'Lab' ? 'Lab' : 'Classroom') && +r.capacity >= (m.size || c.size) && (!r.dept || r.dept === c.dept);
  const ids = m => [m.teacherId, m.coTeacherId].filter(Boolean);
  // Who and what is busy, from every lesson except the ones being moved.
  const occupancy = (others, c) => {
    const o = {tB:new Set(), rB:new Set(), cW:new Set(), cP:{}, tD:{}};
    others.forEach(x => { for(let k=0; k<x.len; k++){ const sl = x.day+'-'+(x.period+k); ids(x).forEach(id => o.tB.add(id+'|'+sl)); o.rB.add(x.roomId+'|'+sl);
        occOf(x).forEach(g => { if(g.batch) (o.cP[g.classId+'|'+sl] = o.cP[g.classId+'|'+sl] || []).push({batch:g.batch, start:x.period, len:x.len}); else o.cW.add(g.classId+'|'+sl); }); }

    for(let k=0; k<len; k++){

      for(const g of groups){
        const pt = o.cP[g.classId+'|'+sl];
        if(o.cW.has(g.classId+'|'+sl) || (pt && !g.batch) || (pt && pt.some(e => e.batch === g.batch))) return null;
      }
      for(const m of ms) for(const id of ids(m)){ const t = byId(S.teachers, id); if(o.tB.has(id+'|'+sl) || (t.off || []).includes(sl)) return null; }
    }
    for(const m of ms){
      for(const id of ids(m)){ const t = byId(S.teachers, id);
        if((o.tD[id+'|'+d] || 0) + len > (t.maxPerDay || P) || !streakOK(q => o.tB.has(id+'|'+d+'-'+q), p, len)) return null; }
      const pref = (byId(S.teachers, m.teacherId) || {}).pref;

    }
    const rooms = [], taken = new Set();
    for(const m of ms){
      const free = r => !taken.has(r.id) && range(len).every(k => !o.rB.has(r.id+'|'+d+'-'+(p+k)) && !(r.off || []).includes(d+'-'+(p+k)));
      const cur = byId(S.rooms, m.roomId), r = cur && free(cur) ? cur : S.rooms.find(r => roomFits(r, m, c) && free(r));
      if(!r) return null; rooms.push(r.id); taken.add(r.id);
    }
    return rooms;
  };
  // A move can change several classes' days (combined lessons), so every class the lessons touch is scored.
  const scoreAll = (ms, others) => [...new Set(ms.flatMap(m => occOf(m).map(g => g.classId)))]
    .reduce((s, cid) => s + classScore(cid, [...others.filter(x => occOf(x).some(g => g.classId === cid)), ...ms]), 0);
  const units = {}; placed.forEach(x => (units[x.unit] = units[x.unit] || []).push(x));
  for(let pass=0; pass<4; pass++){
    let moves = 0;
    for(const key of Object.keys(units)){
      const ms = units[key], c = byId(S.classes, ms[0].classId), len = ms[0].len;
      const others = placed.filter(x => String(x.unit) !== key), o = occupancy(others, c), now = scoreAll(ms, others);
      let bestMove = null;
      for(let d=0; d<D; d++) for(let p=0; p+len<=P; p++){

        if(sc < now - 0.01 && (!bestMove || sc < bestMove.sc)) bestMove = {d, p, rooms, sc};

  const st = S.settings, needed = R.needed || expandSessions().length, mins = periodMinutes();

    const t = byId(S.teachers, x.teacherId);

    const k = x.classId+x.subjectId+(x.batch || '')+'|'+x.day; if(seen[k]) repeats++; seen[k] = 1;

  let longest = 0;
  Object.values(tSlots).forEach(set => { let run = 0; for(let q=0; q<st.periods; q++){
    run = set.has(q) ? (st.breakMode === 'same' && q === st.breakAfter ? 1 : run + 1) : 0; longest = Math.max(longest, run); } });
  const ends = Object.values(classDays(R.placed)).map(ps => mins[Math.max(...ps)].b);

  const latest = ends.length ? Math.max(...ends) : 0;

}

function viewList(by){

const fmtTime = x => `${String(Math.floor(x/60) % 24).padStart(2,'0')}:${String(x % 60).padStart(2,'0')}`;
function periodMinutes(){
  const st = S.settings; const [h, m] = (st.start || '08:30').split(':').map(Number); let t = h*60 + m;
  return range(st.periods).map(p => { const a = t; t += st.length; const out = {a, b:t}; if(st.breakMode === 'same' && p+1 === st.breakAfter) t += st.breakLength; return out; });
}
const periodTimes = () => periodMinutes().map(x => `${fmtTime(x.a)}–${fmtTime(x.b)}`);
function colorFor(str){ let h = 0; for(const ch of String(str)) h = (h*31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
const keyFor = by => by === 'class' ? 'classId' : by === 'teacher' ? 'teacherId' : 'roomId';
const teaches = (x, id) => x.teacherId === id || x.coTeacherId === id;
// The student groups a lesson occupies: its class (or one batch of it), or for a combined lesson several of them.
const occOf = x => x.occ || [{classId:x.classId, batch:x.batch || ''}];
const inView = (x, by, id) => by === 'teacher' ? teaches(x, id) : by === 'class' ? occOf(x).some(g => g.classId === id) : x[keyFor(by)] === id;
function cellLabel(x, by){
  const s = byId(S.subjects, x.subjectId) || {}, c = byId(S.classes, x.classId) || {}, r = byId(S.rooms, x.roomId) || {};
  const t = {name:[x.teacherId, x.coTeacherId].filter(Boolean).map(id => (byId(S.teachers, id) || {}).name).join(' & ')};
  const lines = by === 'class' ? [t.name, r.name] : by === 'teacher' ? [c.name, r.name] : [c.name, t.name, `${x.size || c.size}/${r.capacity} seats`];

}

function mergeLabels(list, by){

}
function grid(by, id){
  const st = S.settings, times = periodTimes(), cells = S.result.placed.filter(x => inView(x, by, id));
  const teacher = by === 'teacher' ? byId(S.teachers, id) : null;
  const br = by === 'class' && S.result.breaks ? S.result.breaks[id] : null;
  const hasBreak = st.breakMode === 'same' && st.breakAfter > 0 && st.breakAfter < st.periods;
  let head = '<tr><th></th>';
  range(st.periods).forEach(p => { head += `<th>P${p+1}<br><small>${times[p]}</small></th>`; if(hasBreak && p+1 === st.breakAfter) head += '<th style="width:34px"></th>'; });
  const body = st.days.map((d, di) => {
    let row = `<tr><td class="day">${d}</td>`;
    // One cell per run of periods with the same lessons, so groups with lessons of different lengths side by side still line up.
    const active = q => cells.filter(c => c.day === di && c.period <= q && c.period + c.len > q);
    for(let p=0; p<st.periods;){
      const here = active(p);
      let span = 1;
      if(here.length){
        const same = q => { const a = active(q); return a.length === here.length && a.every(c => here.includes(c)); };
        while(p + span < st.periods && same(p + span) && !(hasBreak && p + span === st.breakAfter)) span++;
        const L = mergeLabels(here, by);
        row += `<td colspan="${span}"><div class="cell" style="background:${colorFor(L.title)}"><b>${esc(L.title)}</b>${L.subs.map(s => `<small>${esc(s)}</small>`).join('')}</div></td>`;
      }

      else if(fixedAt(by, id, di, p)){
        const f = fixedAt(by, id, di, p), sameFixed = q => { const g = fixedAt(by, id, di, q); return g && g.label === f.label && g.sub === f.sub; };
        while(p + span < st.periods && !active(p + span).length && sameFixed(p + span)) span++;
        row += `<td colspan="${span}" class="off" title="Kept from the imported timetable"><small><b>${esc(f.label)}</b>${f.sub ? '<br>' + esc(f.sub) : ''}</small></td>`;
      }
      else { const off = teacher && (teacher.off || []).includes(di+'-'+p); row += `<td class="${off?'off':''}">${off ? '<small>off</small>' : ''}</td>`; }
      p += span;
      if(hasBreak && p === st.breakAfter && di === 0) row += `<td class="brk" rowspan="${st.days.length}">BREAK</td>`;
    }

// ---------- Absences and cover ----------
// Flow: teacher reports (from their phone) or HOD/admin adds it → HOD/admin assigns cover → substitute and students see it on their phones.
function absenceClasses(a){
  const di = dayIdxOfDate(a.date);
  if(di < 0 || !S.result || !S.result.placed) return [];
  return S.result.placed.filter(x => x.teacherId === a.teacherId && x.day === di).sort((p,q) => p.period - q.period);
}
function absStatus(a){ const cl = absenceClasses(a); return {total:cl.length, covered:cl.filter(x => a.picks && a.picks[x.period]).length}; }
function openAbsences(){
  if(!ROLE || ROLE.type === 'viewer') return [];
  const today = iso(new Date());
  return S.absences.filter(a => { const t = byId(S.teachers, a.teacherId), s = absStatus(a); return t && inScope('teachers', t) && a.date >= today && s.covered < s.total; });
}
function addAbsence(teacherId, date, reason, note, by){
  if(!teacherId) return toast('Pick a teacher.');
  if(!date || dayIdxOfDate(date) < 0) return toast('That date is not a working day.');
  if(S.absences.some(a => a.teacherId === teacherId && a.date === date)) return toast('This absence is already reported.');
  const a = {id:uid(), teacherId, date, reason, note, by, picks:{}, at:new Date().toLocaleString()};
  S.absences.push(a); save(); return a;
}
// relaxed = also allow teachers who would go over their daily limit (used only when nobody else is free).
function findSubs(x, absent, a, relaxed = false){
  const st = S.settings, P = S.result.placed;
  const covers = S.absences.filter(b => b.date === a.date).flatMap(b => absenceClasses(b)
    .filter(y => b.picks[y.period] && !(b === a && y.period === x.period)).map(y => ({tid:b.picks[y.period], period:y.period, len:y.len})));
  const awayToday = new Set(S.absences.filter(b => b.date === a.date).map(b => b.teacherId));
  return S.teachers.filter(c => c.id !== absent.id && !awayToday.has(c.id)).map(c => {
    for(let k=0; k<x.len; k++){
      const p = x.period + k, inSlot = y => y.period <= p && y.period + y.len > p;
      if((c.off || []).includes(x.day+'-'+p)) return null;
      if(P.some(y => teaches(y, c.id) && y.day === x.day && inSlot(y))) return null;
      if(covers.some(y => y.tid === c.id && inSlot(y))) return null;
    }
    const dayLoad = P.filter(y => teaches(y, c.id) && y.day === x.day).reduce((s,y) => s + y.len, 0)
                  + covers.filter(y => y.tid === c.id).reduce((s,y) => s + y.len, 0);
    const isBusy = q => P.some(y => teaches(y, c.id) && y.day === x.day && y.period <= q && y.period + y.len > q) || covers.some(y => y.tid === c.id && y.period <= q && y.period + y.len > q);
    const over = dayLoad + x.len > (c.maxPerDay || st.periods) || !streakOK(isBusy, x.period, x.len);
    if(over && !relaxed) return null;
    const sameDept = c.dept && c.dept === absent.dept, knows = P.some(y => teaches(y, c.id) && y.classId === x.classId);
    const why = [over ? 'over daily or in-a-row limit' : '', sameDept ? 'same dept' : '', knows ? 'knows this class' : '', `${dayLoad} classes that day`].filter(Boolean).join(' · ');
    return {t:c, why, over, score:(over ? 50 : 0) + (sameDept ? 0 : 10) + (knows ? 0 : 3) + dayLoad};
  }).filter(Boolean).sort((p,q) => p.score - q.score);
}
// Why nobody is free at this hour, in plain words.
function busyReason(x, absent, a){
  const P = S.result.placed, others = S.teachers.filter(c => c.id !== absent.id);
  const inSlot = y => y.day === x.day && y.period < x.period + x.len && y.period + y.len > x.period;
  const teaching = others.filter(c => P.some(y => teaches(y, c.id) && inSlot(y))).length;
  const away = others.filter(c => S.absences.some(b => b.date === a.date && b.teacherId === c.id)).length;
  const off = others.filter(c => range(x.len).some(k => (c.off || []).includes(x.day+'-'+(x.period+k)))).length;
  return [`${teaching} teaching`, away ? `${away} absent` : '', off ? `${off} on time off` : ''].filter(Boolean).join(', ') + ` (out of ${others.length} teachers)`;
}
function autoAssign(id){
  const a = byId(S.absences, id), t = byId(S.teachers, a.teacherId), cl = absenceClasses(a);
  const todo = cl.filter(x => !a.picks[x.period]);
  if(!todo.length) return toast('All classes already have cover.');
  let n = 0, extra = 0, none = 0;
  todo.forEach(x => {
    let best = findSubs(x, t, a)[0];
    if(!best){ best = findSubs(x, t, a, true)[0]; if(best) extra++; }
    if(best){ a.picks[x.period] = best.t.id; n++; } else { a.picks[x.period] = 'self'; none++; }
  });
  save(); render();
  toast([n ? `Cover assigned for ${n} class(es)` : '', extra ? `${extra} needed a teacher over their daily limit` : '',
         none ? `${none} set to self-study (nobody free)` : ''].filter(Boolean).join(' · '));
}
function setPick(id, period, tid){ const a = byId(S.absences, id); a.picks[period] = a.picks[period] === tid ? undefined : tid; save(); render(); }
function delAbsence(id){ if(!confirm('Remove this absence?')) return; S.absences = S.absences.filter(a => a.id !== id); save(); render(); }

function pageSubs(){

function copyText(text, msg){

  else fallback();

}

  const val = (v, k) => v.m[k] ?? 0;
